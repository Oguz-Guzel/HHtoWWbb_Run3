    files: 
      - root://cms-xrd-global.cern.ch//store/mc/Run3Summer22NanoAODv12/GluGlutoRadiontoHHto2B2Vto2B2L2Nu_M-450_narrow_TuneCP5_13p6TeV_madgraph-pythia8/NANOAODSIM/130X_mcRun3_2022_realistic_v5-v2/50000/1fc88802-df6c-4640-b8ca-7700a5554ccc.root 
